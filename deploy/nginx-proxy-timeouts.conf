# Snippet for nginx / CapRover "Nginx Configuration" in front of Operations KPI.
# The dashboard first render of / can take many minutes on large databases; default
# proxy_read_timeout (often 60s) causes 504 Gateway Time-out.
#
# Point load-balancer health checks at /healthz (process up), not /.
# Point readiness / traffic gates at /readyz (DB up + dashboard cache warm).
#
# Example (adjust host/upstream as needed):
#
#   location / {
#       proxy_pass http://operations_kpi_upstream;
#       proxy_connect_timeout 60s;
#       proxy_send_timeout 900s;
#       proxy_read_timeout 900s;
#   }

proxy_connect_timeout 60s;
proxy_send_timeout 900s;
proxy_read_timeout 900s;
